openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
  description: Expense claims, approvals and payroll exports.
servers:
  - url: /
paths:
  /me/claims:
    get:
      operationId: listMyClaims
      summary: The caller's own claims
      security:
        - oauth2: [claims:read]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ClaimStatus'
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: The caller's claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyClaim
      summary: Create a draft claim with one or more expense lines
      security:
        - oauth2: [claims:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '201':
          description: Draft claim created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: Invalid claim (e.g. a line over $25 has no receipt)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/claims/{claimId}:
    get:
      operationId: getMyClaim
      summary: One of the caller's claims
      security:
        - oauth2: [claims:read]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '404':
          description: No such claim of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateMyClaim
      summary: Edit a draft, pending or rejected claim of the caller's
      security:
        - oauth2: [claims:manage]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '200':
          description: Claim updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: Invalid claim, or the claim is not editable in its current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/claims/{claimId}/submit:
    post:
      operationId: submitMyClaim
      summary: Submit a draft claim to the caller's manager for approval
      security:
        - oauth2: [claims:manage]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim submitted and now pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: The claim is not a draft, or a line over $25 has no receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/claims/{claimId}/withdraw:
    post:
      operationId: withdrawMyClaim
      summary: Withdraw a claim still pending the manager's decision
      security:
        - oauth2: [claims:manage]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim withdrawn, back to draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: The claim is not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim of the caller's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims:
    get:
      operationId: listTeamClaims
      summary: Claims submitted by the caller's direct reports
      security:
        - oauth2: [claims:review-team]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ClaimStatus'
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: The caller's team's claims, oldest pending first
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims/{claimId}/approve:
    post:
      operationId: approveTeamClaim
      summary: Approve a direct report's pending claim
      security:
        - oauth2: [claims:decide]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: The claim is not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such pending claim of a direct report's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims/{claimId}/reject:
    post:
      operationId: rejectTeamClaim
      summary: Reject a direct report's pending claim with a reason
      security:
        - oauth2: [claims:decide]
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Claim rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: The claim is not pending, or no reason was given
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such pending claim of a direct report's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /claims:
    get:
      operationId: listAllApprovedClaims
      summary: Every approved claim, for payroll export
      security:
        - oauth2: [claims:read-all]
      parameters:
        - name: exported
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Every claim matching the filter
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
  /exports:
    get:
      operationId: listExports
      summary: Past payroll exports
      security:
        - oauth2: [exports:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Past exports
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Export' }
    post:
      operationId: createExport
      summary: Export every approved, not-yet-exported claim as a downloadable file
      security:
        - oauth2: [exports:create]
      responses:
        '201':
          description: Export created; the included claims are now marked exported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
components:
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string }
  schemas:
    ClaimStatus:
      type: string
      enum: [draft, pending, approved, rejected, exported]
    ClaimInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ExpenseLineInput' }
    ExpenseLineInput:
      type: object
      required: [amount, category]
      properties:
        amount: { type: number, format: double }
        category: { type: string }
        categorySource: { type: string, enum: [employee, agent] }
        receiptRef: { type: string, nullable: true }
    ExpenseLine:
      allOf:
        - $ref: '#/components/schemas/ExpenseLineInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
    ExpenseClaim:
      type: object
      required: [id, employeeId, status, lines]
      properties:
        id: { type: string }
        employeeId: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        rejectionReason: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ExpenseLine' }
    Export:
      type: object
      required: [id, exportedBy, exportedAt, claimIds]
      properties:
        id: { type: string }
        exportedBy: { type: string }
        exportedAt: { type: string, format: date-time }
        claimIds:
          type: array
          items: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            claims:read: The caller's own claims
            claims:manage: Create, edit, withdraw or resubmit the caller's own claims
            claims:review-team: Claims submitted by the caller's direct reports
            claims:decide: Approve or reject a direct report's pending claim
            claims:read-all: Every approved claim
            exports:read: Past payroll exports
            exports:create: Export approved claims to payroll
security:
  - oauth2: []
